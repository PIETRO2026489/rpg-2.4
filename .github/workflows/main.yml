name: Gerar EXE do Reino de Elementaria

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Verificar arquivos
        shell: powershell
        run: |
          Write-Host "Arquivos do repositório:"
          Get-ChildItem -Recurse

          if (!(Test-Path "jogo.py")) {
            Write-Host "ERRO: jogo.py não foi encontrado na raiz do projeto."
            exit 1
          }

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Pygame e PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame pyinstaller

      - name: Gerar EXE
        run: |
          python -m PyInstaller --onefile --windowed --name "Reino_de_Elementaria" jogo.py

      - name: Disponibilizar EXE
        uses: actions/upload-artifact@v4
        with:
          name: Reino_de_Elementaria_EXE
          path: dist/Reino_de_Elementaria.exe
