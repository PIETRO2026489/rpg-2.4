name: Gerar EXE do Reino de Elementaria

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Gerar EXE
        run: |
          pyinstaller --onefile --windowed --name "Reino_de_Elementaria" jogo.py

      - name: Salvar EXE
        uses: actions/upload-artifact@v4
        with:
          name: Reino_de_Elementaria
          path: dist/Reino_de_Elementaria.exe
